<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICAO 模拟陆空通话</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14202B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ICAO 通话"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--panel:#ffffff;--ink:#18212b;--mute:#5d6b7a;--line:#d5dce3;--ac:#c77700;--soft:#fff7e0;--slot:#8a4b00;--slotb:#fbeed6;--ok:#1f6f4a;--bad:#b3262b;--badb:#f8e1df}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--panel:#1b222a;--ink:#e6ebf0;--mute:#93a1af;--line:#2c3640;--ac:#f0a030;--soft:#2a2416;--slot:#f4c47c;--slotb:#3b2c14;--ok:#67c79a;--bad:#f08a85;--badb:#3d1f20;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.w{max-width:860px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:0}
.sub{color:var(--mute);margin:2px 0 12px}nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}button,select{font:inherit;color:inherit;cursor:pointer}
.b{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 12px}.b.on,.b.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}.b:disabled{opacity:.5;cursor:default}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grp{margin-bottom:18px}.fam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-bottom:0;padding:9px 12px}
.grp .fam:last-child{border-bottom:1px solid var(--line)}.fam small{color:var(--mute)}.done{color:var(--ok);font-weight:600}
.frame{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ac);padding:10px 14px;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;margin:8px 0}.frame i{font-style:normal;color:var(--slot);background:var(--slotb);padding:0 3px;border-radius:2px}
.diff{background:var(--soft);padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;margin-top:10px}.meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.tm{font:600 22px ui-monospace,Menlo,monospace;min-width:48px}.tm.low{color:var(--bad)}
.p{margin:10px 0 0;overflow-wrap:anywhere}.z{color:var(--mute);font-size:14px;margin:2px 0 0}
.a{font:500 15.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);margin:10px 0 0;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding-top:10px}.a mark{background:none;color:var(--ac);font-weight:700}
.n{font-size:13.5px;color:var(--slot);margin:5px 0 0}.fx{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding:2px 8px;margin:8px 0 0}.fx s{font-family:ui-monospace,Menlo,monospace}
.warn{color:var(--bad);font-size:13.5px}.tip{color:var(--mute);font-size:13.5px}
.list{margin-top:12px}.li{border-top:1px solid var(--line);padding:7px 0;font-size:14px;overflow-wrap:anywhere}.li code{font:13.5px ui-monospace,Menlo,monospace;color:var(--ac)}
.pg{height:6px;background:var(--line);margin:8px 0}.pg div{height:100%;background:var(--ac)}
select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px;max-width:100%}
</style></head><body style="padding-top:env(safe-area-inset-top,0px)"><div class="w"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap"><h1>模拟陆空通话 · 83 套</h1><a href="./" style="color:var(--ac);font-size:13px;text-decoration:none">← 900 句复诵</a></div><p class="sub" id="sum"></p>
<nav><button class="b" data-v="path">句型路线</button><button class="b" data-v="wrong">错题</button><button class="b" data-v="set">83 套全真</button><button class="b" data-v="rule">考试要求</button><button class="b" data-v="five">5 级要求</button></nav><div id="app"></div></div>
<script>
const Q=[[1,1,"R1","Your call sign is UAL805, a flight to Guangzhou. You are approaching WXI at 11000m. You are squawking 6527. Contact Zhengzhou Control.","你的呼号是美联航805，是一架飞往广州的航班。你现在接近WXI，高度11000米，你的应答机编码是6527。联系郑州区调。","Zhengzhou Control, UAL805, approaching WXI at 11000m, squawk 6527.","郑州区调，美联航805，接近WXI，高度11000米，应答机编码6527。","","61a4896fab5a5.mp3","20211129","",""],[1,2,"R6","UAL805, Zhengzhou Control, radar contact, offset 3 miles to the right, reduce to Mach .75, due to Wuhan Control restrictions.","美联航805，郑州区调，雷达识别了，右偏置3海里，由于武汉区调限制，速度减小至马赫数点75。","Offset 3 miles to the right, reduce to Mach decimal 75, UAL805.","收到，右偏置3海里，速度减小至马赫数点75，美联航805。","注：题干中due to Wuhan Control restrictions属于情报，无需复诵，或用roger代替","61a4898b60193.mp3","20211129","Roger, offset 3 miles to the right, reduce to Mach .75, UAL805.、","用语和格式规范"],[1,3,"R2","There is adverse weather ahead, request Zhengzhou Control for 20 miles deviation right of track and state the reason.","前方有恶劣天气，向郑州区调请求右偏航20海里，并陈述原因。","Zhengzhou Control, UAL805, request 20 miles deviation right of track due to weather.","郑州区调，美联航805，由于天气，请求右偏航20海里。","注：题干明确要求state the reason，因此，答案中的due weather不可省略","61a489ac33875.mp3","20211129","Zhengzhou Control, UAL805, request 20 miles deviation right of track due weather.","用语和格式规范"],[1,4,"R7","UAL805, 20 miles deviation to the right approved, report when clear of weather.","美联航805，同意右偏航20海里，脱离天气后报。","20 miles deviation to the right approved, wilco, UAL805.","同意右偏航20海里，脱离天气后报(或“照办”)，美联航805。","注：题干中的report when clear of weather，可用wilco回复","61a489c70b6a7.mp3","20211129","20 miles deviation to the right approved, report when clear of weather, (wilco), UAL805.","改为简明标准用语，去掉冗余和不规范说法"],[1,5,"R2","Now tell the controller you are clear of weather.","现在告诉管制员你已经脱离天气了。","Zhengzhou Control, UAL805, clear of weather.","郑州区调，美联航805，脱离天气了。","","61a489e784e35.mp3","20211129","",""],[1,6,"A1","UAL805, the restriction still exists, reduce speed to Mach.72. Advise Zhengzhou Control Mach .72 is not acceptable which is too slow for your aircraft.","美联航805，依旧存在限制，速度降至马赫数点72。 告诉郑州区调，不能接受马赫数点72，对你的飞机来说，太慢了。","Negative, unable Mach decimal 72, too slow for us, UAL805.","不能马赫数点72，这对我们来说太慢了，美联航805。","注：一般用Negative, unable ...来表达“不能，无法执行”这一含义，并陈述原因","61a48a047ac61.mp3","20211129","Negative, unable Mach.72 because it's too slow for us, UAL805.","改为简明标准用语，去掉冗余和不规范说法"],[1,7,"R6","UAL805, Zhengzhou Control, maintain Mach .75, we are limiting the number of aircraft flying through Zhengzhou control area due to Zhengzhou radar failure.","美联航805，郑州区调，保持马赫数点75，由于郑州雷达失效，我们现在正在限制飞进郑州管制区域的航空器。","Maintain Mach decimal 75, UAL805.","保持马赫数点75，美联航805。","注：we are limiting the number of aircraft flying through Zhengzhou control area due to Zhengzhou radar failure属于情报，无需复诵","61a48a1ae535d.mp3","20211129","Maintain Mach .75, UAL805.","用语和格式规范"],[1,8,"A1","UAL805, what is your estimated time for OBLIK? Inform Zhengzhou Control your estimated time for OBLIK is 0638Z.","美联航805，你预计到达OBLIK的时间是多少？ 告诉郑州区调，你预计到达OBLIK的时间是0638Z。","Estimating OBLIK at 0638Z, UAL805.","预计OBLIK时间0638Z，美联航805。","","61a48a362a39d.mp3","20211129","",""],[1,9,"A1","UAL805, make a right orbit due spacing, reach OBLIK not earlier than 0646Z.","美联航805，由于间距，右盘旋一圈，到达OBLIK的时间不早于0646Z。","Orbit right, reach OBLIK not earlier than 0646Z, UAL805.","右盘旋一圈，到达OBLIK的时间不早于0646Z，美联航805。","","61a48a4dc2478.mp3","20211129","",""],[1,10,"N2","You have completed the orbit, request track direct to OBLIK.","你完成盘旋，请求直飞OBLIK。","Zhengzhou Control, UAL805, request track to OBLIK.","郑州区调，美联航805，请求直飞OBLIK。","","61a48a7d8952a.mp3","20211129","",""],[1,11,"R8b","UAL805, negative direct to OBLIK, turn left heading 130 to intercept A461 airway.","美联航805，不能直飞OBLIK，左转航向130，切A461航路。","Turn left heading 130 to intercept A461 airway, UAL805.","收到，左转航向130，切A461航路，美联航805。","","61a48a94ce72b.mp3","20211129","Roger, turn left heading 130 to intercept A461 airway, UAL805.","用语和格式规范"],[2,1,"R1","Your call sign is CSN3109, from Wuhan to Beijing, you are now leveling at 8900 meters, expect OBLIK 25, make a position report to Guangzhou Control.","你的呼号是南方3109，从武汉飞往北京，你现在在8900米平飞，预计25分到达OBLIK，向广州区调做位置报。","Guangzhou Control, CSN3109, leveling at 8900 meters, estimating OBLIK at 25.","广州区调，南方3109，8900米平飞，预计25分过OBLIK。","","60c33264c0f86.mp3","20210611","Guangzhou Control, CSN3109, leveling at 8900 meters, expect OBLIK 25.","预计用 estimating，不是 expect"],[2,2,"R8a","CSN3109, Guangzhou Control, maintain present altitude, contact Beijing Control on 132.2.","南方3109，广州区调，保持当前高度，联系北京区调132.2。","Maintain present altitude and contact Beijing Control on 132.2, CSN3109.","保持当前高度，联系北京区调132.2，南方3109。","注：此处答案可以省略为：present attitude and 132.2.","60c33285e58a4.mp3","20210611","",""],[2,3,"R2","[Your weather radar shows that there is a thunderstorm 33 miles ahead, you want to climb to 10100m to fly over it, contact Beijing Control.]","[你的气象雷达显示前方33海里有雷暴，你想上10100米飞越雷暴，联系北京区调。]","Beijing Control, CSN3109, thunderstorm 33 miles ahead on weather radar, request climb to 10100m to fly over it.","北京区调，南方3109，我们的气象雷达显示前方33海里有雷暴，请求上10100米飞越雷暴。","注：此处答案可省略为：Beijing Control, CSN3109, request climb to 10100m due weather/bad weather/adverse weather.","60c332a103bfc.mp3","20210611","Beijing Control, CSN3109, our weather radar shows that there is a thunderstorm 33 miles ahead, request climb to 10100m to fly over it.","改为简明标准用语，去掉冗余和不规范说法"],[2,4,"A1","CSN3109, negative, but you can either turn left or right to go round it, which do you prefer? [Tell controller you can make a left turn.]","南方3109，不可，但是你可以左转或者右转来飞避它，你更喜欢哪一个？ [告诉管制员，你可以左转。]","Request a left turn, CSN3109.","请求左转，南方3109。","注：此处为被动报话格式：通话内容+己方呼号；go round：绕飞。","627874a374cc4.mp3","20220509","",""],[2,5,"R8b","CSN3109, turn left heading 270 for 5 miles, when clear of weather, return to the original route.","南方3109，可以左转270度飞5海里，当脱离天气，回到原航路。","Left heading 270 for 5 miles, wilco, CSN3109.","左转270度飞5海里，照办，南方3109。","","60c3331fc5c7b.mp3","20210611","",""],[2,6,"R8a","[Now you are clear of weather and back to the original course.] CSN3109, descend to 7500m.","[现在你脱离天气，回到原航路了。] 南方3109，下到7500米。","Descend to 7500m, CSN3109.","下到7500米，南方3109。","","60c33347307f6.mp3","20210611","",""],[2,7,"E2","During the descent, you encountered a strong hail and experienced heavy turbulence. The outer windshield of your aircraft cracked due to hail strike, tell your situation to Beijing Approach, and request emergency landing, this is a distress call.","在下降过程中，你遇到了冰雹和颠簸。飞机外侧风挡玻璃由于冰雹撞击而出现裂纹，将情况告知北京区调，请求紧急着陆，这是一个遇险呼叫。","MAYDAY, MAYDAY, MAYDAY, Beijing Approach, CSN3109, outer windshield cracked due to hail strike, heavy turbulence, request emergency landing.","MAYDAY MAYDAY MAYDAY. 北京进近，南方3109，我们外侧风挡玻璃由于冰雹撞击而出现裂纹，请求紧急着陆。","","60c3336333c81.mp3","20210611","MAYDAY MAYDAY MAYDAY, Beijing Approach, CSN3109, our outer windshield cracked due to hail strike, request emergency landing.","漏颠簸"],[2,8,"L4","CSN3109, roger Mayday, cleared for ILS approach, runway 36R, and you are No.1 in the landing sequence.","南方3109，收到MAYDAY，可以ILS进近，跑道36右，你是第一个着陆。","Cleared for ILS approach, runway 36R, No.1 in landing sequence, CSN3109.","可以ILS进近，跑道36右，第一个着陆，南方3109。","","60c3337f03aeb.mp3","20210611","",""],[2,9,"A1","CSN3109, when able, state your situation. [Inform the controller that your engines and control surfaces are working normally, but the outer windshield is cracked.","南方3109，可以的时候，陈述你的情况。 [告知管制员，飞机发动机和操纵面正常，但是外侧风挡玻璃出现裂纹。]","Engines and control surfaces normal, outer windshield cracked, CSN3109.","飞机发动机和操纵面正常，但是外侧风挡玻璃出现裂纹， 南方3109。","","60c3339bc9ebe.mp3","20210611","Our engines and control surfaces are working normally, but the outer windshield is cracked, CSN3109.","改为简明标准用语，去掉冗余和不规范说法"],[2,10,"A1","CSN3109, report persons on board and confirm whether you need medical services upon arrival. [Inform Beijing Approach that you have 275 passengers on board and there is no injury report, so no medical assistance is required.]","南方3019，报告机上人数，证实着陆后是否需要医疗救援。 [告诉管制员，机上有275名乘客，无人受伤，不需要医疗救援。]","275 passengers on board, no injury reported, no medical assistance required, CSN3109.","我们机上有275名乘客，无人受伤，不需要医疗救援，南方3109。","","60c33429bbc61.mp3","20210611","We have 275 passengers on board and there is no injury report, no medical assistance is required, CSN3109.","改为简明标准用语，去掉冗余和不规范说法"],[2,11,"N1","CSN3109, continue approach and contact Tower on 118.6.","南方3109，继续进近，联系塔台118.6。","Continue approach and contact Tower on 118.6, CSN3109.","继续进近，联系塔台118.6，南方3109。","注：此处答案可省略为：Continue approach and 118.6, CSN3109.","60c334444f109.mp3","20210611","",""],[2,12,"L4","CSN3109, wind 310, 5m/s, runway 36R, cleared to land.","南方3109，风310度，5米每秒，跑道36右，可以落地。","Cleared to land, runway 36R, CSN3109.","可以落地，跑道36右，南方3109。","","60c33467a288a.mp3","20210611","",""],[2,13,"G4","CSN3109, vacate runway via W6.","南方3109，通过W6滑行道脱离。","Vacate runway via W6, CSN3109.","通过W6滑行道脱离，南方3109。","","60c334811c08d.mp3","20210611","",""],[2,14,"N1","CSN3109, contact Ground on 121.8, good bye.","南方3109，联系地面121.8，再见。","Contact Ground on 121.8, CSN3109.","联系地面121.8，南方3109。","注：此处答案可省略为：121.8, CSN3109.","60c3349d51637.mp3","20210611","",""],[2,15,"G2","[You find an Airbus 320 block the taxiway W6 ahead, you now want to change taxiway to E6, call Beijing Ground.]","[你发现前方W6滑行道被一架A320挡住，你现在想更换至E6滑行道，呼叫北京地面。]","Beijing Ground, CSN3109, A320 blocking taxiway W6 ahead, request change to taxiway E6.","北京地面，南方3109，前方W6滑行道被一架A320挡住，请求更换至E6滑行道。","","60c334b748242.mp3","20210611","Beijing Ground, CSN3109, an Airbus 320 is blocking the taxiway W6 ahead, request change to taxiway E6.","改为简明标准用语，去掉冗余和不规范说法"],[2,16,"G3","CSN3109, change to taxiway E6 approved, taxi with caution due the taxiway is slippery.","南方3109，可以更换至E6滑行道，跑道湿滑，谨慎滑行。","Taxiway E6 approved, thanks, CSN3109.","可以E6滑行道。谢谢，南方3109。","注：题干中的change to taxiway E6 approved属许可，需要复诵。","60c334ce1cd7c.mp3","20210611","",""],[3,1,"D2","Your call sign is AFR332, at stand No.223, ask for push back and startup instructions.","你的呼号是法航332，你在223号停机位，申请推出开车指令。","Wuhan Ground, AFR332, stand No.223, request pushback and start-up.","武汉地面，法航332, 223号停机位，申请推出开车。","注：stand: 停机位，除了stand外，无线电陆空通话中表示“停机位”的单词还有gate, parking bay，单独使用bay也意为停机位。","6087a250dc866.mp3","20210427","",""],[3,2,"G1","AFR332, pushback and startup approved, long push.","法航332，同意推出开车，推长点。","Pushback and start-up approved, long push, AFR332.","同意推出开车，长推，法航332。","","6094ead148ec8.mp3","20210507","",""],[3,3,"G2","Now you realize the tug is not in position yet, request a tug.","现在你发现拖车没有就位，请求拖车。","Wuhan Ground, AFR332, request a tug.","武汉地面，法航332，请求拖车。","","6087a294e5709.mp3","20210427","",""],[3,4,"I1","AFR332, roger, tug is on the way.","法航332，拖车已经在路上了。","Roger, thanks, AFR332.","收到，谢谢，法航332。","","6087a2b62290d.mp3","20210427","",""],[3,5,"D3","Now you have finished pushback and startup procedure, you are ready for taxi.","现在，你完成了推出和开车程序，你准备好滑行了。","Wuhan Ground, AFR332, request taxi.","武汉地面，法航332，请求滑行。","","6087a2d14e7f6.mp3","20210427","",""],[3,6,"G3","AFR332, taxi via taxiway A3, A, E5 to the holding point of runway 22. Taxi with caution, the taxiway is slippery due to the heavy rain.","法航332，经由滑行道A3，A，E5滑至跑道22外等待点，谨慎滑行，由于大雨，滑行道湿滑。","Taxi via taxiway A3, A, E5 to the holding point of runway 22, roger caution, AFR332.","经由滑行道A3，A，E5滑至跑道22外等待点，收到提醒，法航332。","注：管制员给出的影响飞行或地面安全的情报信息，如题干中的Taxi with caution, the taxiway is slippery due to the heavy rain，我们可以使用“roger caution--收到提醒”这一结构来回复。","6087a2ecd4b1b.mp3","20210427","",""],[3,7,"T1","[Now you reached the holding point of runway 22, request line up instructions.]","[你现在到达跑道22外等待点，请求上跑道指令。]","Wuhan Tower, AFR332, request line up.","武汉塔台，法航332，请求上跑道。","","6087a312c64f0.mp3","20210427","",""],[3,8,"T5","AFR332, behind the landing A330, line up behind.","法航332，在着陆的A330后面，上跑道等待。","Behind the landing A330, line up behind, AFR332.","在着陆的A330后面，上跑道等待，法航332。","","6094eba8eea08.mp3","20210507","",""],[3,9,"T4","AFR332, when ready, cleared for takeoff.","法航332，准备好后可以起飞。","When ready, cleared for takeoff, runway 22, AFR332.","可以起飞，跑道22，法航332。","","6087a36a4e4b0.mp3","20  you want to carry out evacuation, and request emergency equipment.","火无法熄灭，告知管制员此情况。同时，你想执行应急撤离，请求应急设备。","MAYDAY, MAYDAY, MAYDAY, Wuhan Tower, BAW931, unable to extinguish engine fire, evacuating, request emergency services.","武汉塔台，英航931，火无法熄灭，请求应急撤离和应急设备。","","20260525150902-6a13f58eac0f1.mp3","20260525","Wuhan Tower, BAW931, We can’t extinguish the fire, request emergency evacuation and emergency equipment .","发动机火灭不掉属遇险，撤离是决定不是请求"]],M={"G":[["先分清怎么回","管制说的话先判断属于哪一类，这决定你复诵、Roger 还是 Wilco。",["C1","I1","I2","I3"]],["放行与推出","开口第一组，结构最固定。",["D1","D4","D2","G1"]],["滑行与地面","路线和 hold short 是采分点。",["D3","G3","G4","H1","G2"]],["起飞离场","记住等待点、条件排队和中断起飞。",["T1","T5","T4","T3","T2"]],["航路","位置报、高度、航向、速度和绕飞。题量最大。",["R1","R8a","R8b","R6","R3","R2","R7","R5","Q3"]],["进近着陆","从进近指令到复飞。",["L2","H2","L1","L4","L3","L5"]],["特情与非正常","紧急呼叫和情况报告都用同一个骨架。",["E1","E2","E4","N1","N2","A1","X1"]]],"F":{"C1":["换频率","<i>频率<\/i>, <i>呼号<\/i>.","只报频率，不用复述 contact Tower。有高度或航向时，先复诵指令再报频率。"],"I1":["情报回 Roger","Roger, thanks, <i>呼号<\/i>.","对方只是告知，没有让你做事：风、施工、救援已就位。有 caution 可回 roger caution。题干如果同时有指令，指令要复诵。"],"I2":["让你报告回 Wilco","Wilco, <i>呼号<\/i>.","report when…、advise…、keep us advised 回 Wilco。它是“照办”，和只表示收到的 Roger 不同。"],"I3":["让你等回 Standing by","Standing by, <i>呼号<\/i>.","本频率稍等。和 hold position（地面原地等待）不同，后者回 Holding。"],"D1":["请求放行","<i>Wuhan<\/i> Delivery, <i>呼号<\/i>, gate <i>213<\/i>, information <i>W<\/i>, request ATC clearance to <i>目的地<\/i>.","题目给什么报什么：机位、通播、目的地。这是主动呼叫，单位和呼号放开头。"],"D4":["复诵放行","Cleared to <i>目的地<\/i> via flight planned route, runway <i>R<\/i>, <i>SID<\/i> departure, initial climb <i>高度<\/i>, cruising level <i>高度<\/i>, <i>频率<\/i>, squawk <i>编码<\/i>, <i>呼号<\/i>.","按管制说的顺序复诵，呼号放最后。题干没说应答机就不报。"],"D2":["请求推出开车","<i>Wuhan<\/i> Ground, <i>呼号<\/i>, <i>gate 213<\/i>, request pushback and start-up.","和请求滑行只差一个动作：还在机位时用 pushback，已推出开车时用 taxi。"],"G1":["复诵推出","<i>条件<\/i>, pushback and start-up approved, facing <i>east<\/i>, <i>呼号<\/i>.","有条件时，条件放句首，比如 After A340 behind。朝向必须复诵。"],"D3":["请求滑行","<i>Wuhan<\/i> Ground, <i>呼号<\/i>, request taxi.","题目说已完成推出开车时，可加 pushback and start-up completed。"],"G3":["复诵滑行路线","Taxi via <i>Z4, A3, A<\/i> to holding point runway <i>R<\/i>, hold short of <i>E1<\/i>, <i>呼号<\/i>.","路线、等待点、hold short 都要说。taxi with caution 属情报，回 roger caution。"],"G4":["让路、跟随、穿越、脱离","Give way to <i>A320<\/i> / Follow <i>A319<\/i> / Cross runway <i>R<\/i> / Vacate via <i>E3<\/i>, <i>呼号<\/i>.","穿越和进入跑道的许可必须复诵。report vacated 回 wilco。"],"H1":["地面原地等待","Holding, <i>呼号<\/i>.","hold position 回 Holding；hold short 回 Holding short。"],"G2":["地面请求保障","<i>Wuhan<\/i> Ground, <i>呼号<\/i>, request <i>a tug / ground power unit<\/i> due to <i>原因<\/i>.","题目问原因时，due to 后面的原因不能省。"],"T1":["报告准备起飞","<i>Wuhan<\/i> Tower, <i>呼号<\/i>, holding point runway <i>R<\/i>, ready for departure.","统一用 ready for departure，不说 request departure。"],"T5":["排队","Behind <i>B737<\/i>, line up behind, runway <i>R<\/i>, <i>呼号<\/i>.","条件 behind 必须说。Line up and wait 只是排队等待，不是起飞许可。"],"T4":["复诵起飞许可","Cleared for takeoff runway <i>R<\/i>, <i>呼号<\/i>.","风不用复诵。带有航向、高度或频率的，要一起复诵。"],"T3":["中断起飞","<i>Wuhan<\/i> Tower, <i>呼号<\/i>, stopping, <i>原因<\/i>.","正在减速说 stopping，已经停下说 stopped, rejected takeoff。"],"T2":["离地后联系离场","<i>Wuhan<\/i> Departure, <i>呼号<\/i>, airborne, passing <i>600m<\/i> for <i>1500m<\/i>.","和位置报的区别：这里报正在穿越的高度和目标高度，不报 over 某点。"],"R1":["初始联系与位置报","<i>Control<\/i>, <i>呼号<\/i>, over <i>OBLIK<\/i> at <i>35<\/i>, maintaining <i>9500m<\/i>, next <i>ZF<\/i> at <i>50<\/i>, squawk <i>5505<\/i>.","题目给什么报什么。进近单位还要加 information。“接近某点”说 approaching，“已过”说 over。"],"R8a":["复诵高度","Descend and maintain <i>高度<\/i>, <i>呼号<\/i>.","climb to、maintain 照原话说。expedite until passing 的条件不能丢。"],"R8b":["复诵航向、直飞加高度","Turn right heading <i>070<\/i>, climb to and maintain <i>4500m<\/i>, <i>呼号<\/i>.","先航向后高度，按管制顺序。左右不能错。QNH 必须复诵。"],"R6":["复诵速度","Reduce to Mach <i>decimal 75<\/i> / Maintain <i>290 knots<\/i>, <i>呼号<\/i>.","由于流控等原因属情报，不用复诵；数值必须复诵。"],"R3":["因颠簸、积冰请求换高度","<i>Control<\/i>, <i>呼号<\/i>, maintaining <i>高度<\/i>, r function rule(){nav('rule');$('#app').onclick=null;const fx=Q.filter(q=>q[10]).length;$('#app').innerHTML=`<h2>按考试要求这样练</h2><div class="list"><div class="li">题型：15 至 20 个对话，飞行员角色，电脑播放管制指令和画外音。每个对话 30 秒，约 15 分钟。</div><div class="li">过线：10 个得分点答对 7 个以上，结构和理解才能到 4 级以上。</div><div class="li">评分：评分员依据标准答案，从发音、结构、词汇、流利和理解五方面评定。</div><div class="li">用语：优先用 ICAO 标准术语，标准术语覆盖不了时用简明英语。</div></div><h2 style="margin-top:18px">答案怎么处理</h2><div class="list"><div class="li">主答案是按 ICAO 标准用语和 5 级要求修订的版本，共修订 ${fx} 轮，其余意思和用语都合适的沿用 App 答案。</div><div class="li">有修订的题，答案下方显示 App 原答案和修改原因，方便对照。</div><div class="li">我没有拿到考试的逐题采分表。考试当天说法和 App 原答案不完全相同时，只要指令、数字和意图都准确，通常更符合大纲要求；具体判分以考官和教员为准。</div><div class="li">高亮是程序按规则标出的要点，只作提示。</div></div><h2 style="margin-top:18px">离线语音</h2><p class="sub">下载后没网也能听，手机上约需几十 MB，请在 Wi-Fi 下进行。</p><button class="b pri" id="dl">下载全部语音到本机</button><p class="tip" id="dls"></p>`;
 const st=$('#dls');(async()=>{try{const c=await caches.open(ACACHE),k=await c.keys(),n=k.filter(r=>Q.some(q=>r.url==url(q))).length;st.textContent=`已下载 ${n} / ${Q.length} 条。`}catch(e){st.textContent='这个浏览器不支持离线保存，语音只能联网播放。'}})();
 $('#dl').onclick=async e=>{e.target.disabled=true;let ok=0,fail=0;try{const c=await caches.open(ACACHE);for(const q of Q){const u=url(q);if(await c.match(u)){ok++}else{try{const r=await fetch(u,{mode:'cors'});if(!r.ok)throw 0;await c.put(u,new Response(await r.blob(),{headers:{'Content-Type':'audio/mpeg'}}));ok++}catch(x){fail++}}if(document.contains(st))st.textContent=`正在下载… ${ok+fail} / ${Q.length}`}
  if(document.contains(st))st.textContent=fail?`完成 ${ok} 条，${fail} 条失败。可以再点一次；如果一直失败，说明录音服务器不允许离线保存，这些语音只能联网播放。`:`全部 ${ok} 条语音已下载，没网也能听。`}catch(x){st.textContent='这个浏览器不支持离线保存，语音只能联网播放。'}e.target.disabled=false}}
