<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPI 口试</title>
<style>
:root{--ink:#14202B;--paper:#F4F1EA;--muted:#5B6670;--rule:#C9C3B6;--accent:#0B6E8A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8E4DA;--paper:#12181E;--muted:#9AA4AD;--rule:#33404B;--accent:#5BB8D4}}
:root[data-theme="dark"]{--ink:#E8E4DA;--paper:#12181E;--muted:#9AA4AD;--rule:#33404B;--accent:#5BB8D4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px;display:grid;gap:16px}
h1{font-size:30px;margin:0;line-height:1.2}.muted{color:var(--muted)}.small{font-size:14px}
button,a.btn{font:inherit;padding:12px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;text-decoration:none;text-align:center;cursor:pointer}
.primary{background:var(--ink);color:var(--paper)}ol{padding-left:20px;margin:0}
</style></head><body><main id="m"><p class="muted">正在打开 OPI…</p></main>
<script>
/* OPI 内容不在公开仓库里。用户导入自己的离线版文件后，保存在本机浏览器缓存中，之后离线打开。 */
(function(){
var CN='icao900-opi',KEY='./__opi_local.html',m=document.getElementById('m');
var BACK='<a href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:9px 13px;background:#14202B;color:#fff;border-radius:8px;text-decoration:none;font:14px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)">← 900 句</a>';
function ok(t){return t&&t.indexOf('id="pack"')>0&&t.indexOf('COLD QUESTIONS')>0}
function show(t){var i=t.lastIndexOf('</body>');t=i>0?t.slice(0,i)+BACK+t.slice(i):t+BACK;document.open();document.write(t);document.close()}
function ui(msg){
 m.innerHTML='<a href="index.html" class="small" style="color:var(--accent)">← 返回 900 句</a><h1>OPI 口试</h1>'+(msg?'<p style="color:#B3261E">'+msg+'</p>':'')+
 '<p class="muted">OPI 内容只保存在你这台设备上，不放在公开网站里。第一次使用需要导入一次文件。</p>'+
 '<ol><li>在 Claude 里下载 <b>OPI口试-离线版.html</b>，存到手机或电脑。</li><li>点下面的按钮，选这个文件。</li><li>导入后，以后从 900 句点“OPI 口试”就能直接打开，没网也可以。</li></ol>'+
 '<button class="primary" id="b">导入 OPI 文件</button><input type="file" id="f" accept=".html,text/html" hidden>'+
 '<p class="small muted">以后收到新版文件，在 900 句首页点“导入新版 OPI”，再选新文件即可；练习进度不会丢。</p>';
 var f=document.getElementById('f');document.getElementById('b').onclick=function(){f.click()};
 f.onchange=function(){var x=f.files[0];if(!x)return;x.text().then(function(t){
  if(!ok(t)){ui('这个文件不是 OPI 离线版，请重新选择。');return}
  return caches.open(CN).then(function(c){return c.put(KEY,new Response(t,{headers:{'Content-Type':'text/html; charset=utf-8'}}))}).then(function(){show(t)})
 }).catch(function(){ui('导入失败。请用 Safari 或 Chrome 打开 900 句后再试。')})}
}
if(location.hash==='#import'){ui('');return}
if(!window.caches){ui('这个浏览器不支持本机保存，请换 Safari 或 Chrome。');return}
caches.open(CN).then(function(c){return c.match(KEY)}).then(function(r){return r?r.text():null}).then(function(t){if(ok(t))show(t);else ui('')}).catch(function(){ui('')});
})();
</script></body></html>
