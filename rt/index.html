<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICAO 模拟陆空通话</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14202B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ICAO 通话"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#eef1f4;--panel:#ffffff;--ink:#18212b;--mute:#5d6b7a;--line:#d5dce3;--ac:#c77700;--soft:#fff7e0;--slot:#8a4b00;--slotb:#fbeed6;--ok:#1f6f4a;--bad:#b3262b;--badb:#f8e1df}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

.b{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 12px}.b.on,.b.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}.b:disabled{opacity:.5;cursor:default}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grp{margin-bottom:18px}.fam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-bottom:0;padding:9px 12px}

.frame{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ac);padding:10px 14px;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;margin:8px 0}.frame i{font-style:normal;color:var(--slot);background:var(--slotb);padding:0 3px;border-radius:2px}
.diff{background:var(--soft);padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;margin-top:10px}.meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.tm{font:600 22px ui-monospace,Menlo,monospace;min-width:48px}.tm.low{color:var(--bad)}
.p{margin:10px 0 0;overflow-wrap:anywhere}.z{color:var(--mute);font-size:14px;margin:2px 0 0}
.a{font:500 15.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);margin:10px 0 0;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding-top:10px}.a mark{background:none;color:var(--ac);font-weight:700}
.n{font-size:13.5px;color:var(--slot);margin:5px 0 0}.fx{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding:2px 8px;margin:8px 0 0}.fx s{font-family:ui-monospace,Menlo,monospace}
.warn{color:var(--bad);font-size:13.5px}.tip{color:var(--mute);font-size:13.5px}
.list{margin-top:12px}.li{border-top:1px solid var(--line);padding:7px 0;font-size:14px;overflow-wrap:anywhere}.li code{font:13.5px ui-monospace,Menlo,monospace;color:var(--ac)}
.pg{height:6px;background:var(--line);margin:8px 0}.pg div{height:100%;background:var(--ac)}
select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px;max-width:100%}
.star{color:#d99a00;margin-left:2px}.b.cur{outline:2px solid var(--ac);outline-offset:1px;font-weight:700}.grid .b{min-width:42px;padding:5px 8px}</style></head><body style="padding-top:env(safe-area-inset-top,0px)"><div id="gate" class="w" style="max-width:420px;padding-top:70px"><h1>模拟陆空通话</h1><p class="sub">请输入验证码。</p><form id="gf"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="验证码" placeholder="XXXX-XXXX-XXXX" style="width:100%;font:16px ui-monospace,Menlo,monospace;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--ink)"><div class="row"><button class="b pri" id="gb">进入</button></div><p class="warn" id="ge" hidden></p></form></div><div class="w" id="main" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap"><h1>模拟陆空通话 · 83 套</h1><button class="b" id="out" style="font-size:13px;padding:3px 10px">退出</button></div><p class="sub" id="sum"></p><div class="row" style="margin:0 0 8px"><span class="tip" id="audTop"></span></div>
<nav><button class="b" data-v="path">句型路线</button><button class="b" data-v="wrong">错题</button><button class="b" data-v="favs">收藏</button><button class="b" data-v="set">83 套全真</button><button class="b" data-v="rule">考试要求</button><button class="b" data-v="five">5 级要求</button></nav><div id="app"></div></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>s.toUpperCase().replace(/[^0-9A-Z]/g,'');
async function unlock(code){const K=await fetch('keys.json',{cache:'no-cache'}).then(r=>r.json());const pw=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(K.salt),iterations:K.iter,hash:'SHA-256'},pw,{name:'AES-GCM',length:256},false,['decrypt']);
 let raw=null;for(const e of K.keys){try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},kek,b64(e.ct));break}catch(x){}}if(!raw)return null;
 const ck=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),D=await fetch('data.enc',{cache:'no-cache'}).then(r=>r.json());
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},ck,b64(D.ct));
 return JSON.parse(new TextDecoder().decode(gz))}
function app(Q,M){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let R=load('rtp.r',{}),W=load('rtp.w',{}),audio=null,tick=null,base='https://resource.feizhiyi.com/fzy/';
const byF={};Q.forEach((q,i)=>(byF[q[2]]=byF[q[2]]||[]).push(i));
function stop(){if(audio){audio.onerror=null;audio.onended=null;audio.pause();audio=null}clearInterval(tick)}
const ACACHE='icao-rt-audio',url=q=>base+q[9]+'/'+q[8];
async function cachedUrl(u){try{const c=await caches.open(ACACHE),r=await c.match(u);return r&&r.type!=='opaque'?URL.createObjectURL(await r.blob()):null}catch(e){return null}}
async function play(i,done,err){stop();const u=url(Q[i]),a=new Audio();audio=a;a.onended=done;a.onerror=err;a.src=await cachedUrl(u)||u;if(audio===a)a.play().catch(()=>{})}
const hl=s=>esc(s).replace(/\b(\d[\d.,]*(?:m|L|R)?|cleared|expect|wilco|roger|hold short|holding|behind|after|until|squawk|QNH|affirm|negative|unable|request|runway|heading|PAN PAN|MAYDAY|going around|due)\b/gi,'<mark>$1</mark>');
function mastered(f){const d=M.D[f]||[];return d.filter(i=>R[i]==1).length}
function nav(v){stop();document.querySelectorAll('nav .b').forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
document.querySelector('nav').onclick=e=>{const v=e.target.dataset.v;if(v)({path,wrong,favs,set,rule,five})[v]()};
function summary(){const t=Object.values(M.D).flat().length,o=Object.values(M.D).flat().filter(i=>R[i]==1).length;$('#sum').textContent=`83 套 ${Q.length} 轮对话，归成 ${Object.keys(M.F).length} 个句型，精选 ${t} 题。已掌握 ${o} 题，错题 ${Object.keys(W).length} 题，收藏 ${Q.filter((q,i)=>isFav(i)).length} 题。`}
function path(){nav('path');summary();$('#app').innerHTML=M.G.map((g,n)=>`<div class="grp"><h2>${n+1}. ${g[0]}</h2><p class="sub">${g[1]}</p>`+g[2].map(f=>{const d=M.D[f].length,m=mastered(f);return `<button class="fam" data-f="${f}"><span>${M.F[f][0]}<br><small>83 套出现 ${byF[f].length} 次${byF[f].filter(isFav).length?` · <span class="star">★</span> ${byF[f].filter(isFav).length}`:''}</small></span><span class="${m==d?'done':''}">${m} / ${d}</span></button>`}).join('')+'</div>').join('');
 $('#app').onclick=e=>{const b=e.target.closest('.fam');if(b)fam(b.dataset.f)}}
function fam(f,opt={}){const F=M.F[f],D=M.D[f],rest=byF[f].filter(i=>!D.includes(i));let mode=opt.mode||'pick';
 const list=()=>mode=='pick'?D:mode=='all'?D.concat(rest):mode=='arc'?byF[f].filter(isArc):byF[f].filter(isFav);
 $('#app').onclick=null;$('#app').innerHTML=`<button class="b" id="bk">返回路线</button><h2 style="margin-top:12px">${F[0]}</h2><div class="frame">${F[1]}</div><div class="diff"><b>注意区分：</b>${F[2]}</div><div class="row" id="tabs"></div><div class="row grid" id="grid"></div><div class="row"><button class="b" id="vr">显示文字列表</button></div><div class="list" id="ls" hidden></div><div id="run"></div>`;
 const box=$('#run');box._fam=f;
 const tabs=()=>{$('#tabs').innerHTML=[['pick','精选',D.length],['all','全部同类',byF[f].length],['fav','只练收藏',byF[f].filter(isFav).length],['arc','收藏库',byF[f].filter(isArc).length]].map(t=>`<button class="b${mode==t[0]?' on':''}" data-m="${t[0]}">${t[1]} ${t[2]}</button>`).join('')};
 const grid=()=>{const L=list();$('#grid').innerHTML=L.map((i,k)=>gbtn(i,k,box._cur===i)).join('');const l=$('#ls');if(!l.hidden)lst()};
 const lst=()=>{$('#ls').innerHTML=list().map((i,k)=>{const q=Q[i];return `<div class="li" data-k="${k}" style="cursor:pointer">${isFav(i)?'<span class="star">★</span> ':''}${esc(q[3])}<br><code>${esc(q[5])}</code> <span class="tip">第 ${q[0]} 套 第 ${q[1]} 轮</span></div>`}).join('')};
 const end=()=>{const all=M.G.flatMap(g=>g[2]),nf=all[all.indexOf(f)+1];box.innerHTML=`<div class="card"><b>这一组练完了。</b><div class="row"><button class="b pri" id="nx">下一个句型</button><button class="b" id="ag">再练一遍</button></div></div>`;$('#nx').onclick=()=>nf?fam(nf):path();$('#ag').onclick=()=>start(0)};
 const start=k=>{const L=list();if(!L.length){stop();box.innerHTML=mode=='arc'?'<p class="sub">这一类的收藏库还没有题目。</p>':'<p class="sub">这一类还没有收藏。练习时点“收藏”就会出现在这里。</p>';return}drill(box,L,k,end)};
 box._show=grid;box._fav=()=>{tabs();grid()};
 tabs();grid();$('#bk').onclick=path;
 $('#tabs').onclick=e=>{const b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;box._cur=null;tabs();grid();start(0)}};
 const jump=e=>{const b=e.target.closest('[data-k]');if(b)start(+b.dataset.k)};$('#grid').onclick=jump;$('#ls').onclick=jump;
 $('#vr').onclick=()=>{const l=$('#ls');l.hidden=!l.hidden;$('#vr').textContent=l.hidden?'显示文字列表':'收起文字列表';if(!l.hidden)lst()};
 const s=opt.start!=null?list().indexOf(opt.start):0;start(s<0?0:s)}
function gbtn(i,k,cur){const q=isFav(i);return `<button class="b${R[i]==1?' ok':W[i]?' no':''}${cur?' cur':''}" data-k="${k}" aria-label="第 ${k+1} 题${q?'，已收藏':''}">${k+1}${q?'<span class="star">★</span>':''}</button>`}
function favs(view='fav'){nav('favs');$('#app').onclick=null;summary();const ok=view=='arc'?isArc:isFav,L=Q.map((q,i)=>i).filter(ok),rows=M.G.flatMap(g=>g[2]).map(f=>[f,byF[f].filter(ok).length]).filter(r=>r[1]),nF=Q.filter((q,i)=>isFav(i)).length,nA=Q.filter((q,i)=>isArc(i)).length;
 const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 $('#app').innerHTML=`<div class="row" id="ftabs"><button class="b${view=='fav'?' on':''}" data-t="fav">收藏 ${nF}</button><button class="b${view=='arc'?' on':''}" data-t="arc">收藏库 ${nA}</button></div><p class="sub" style="margin-top:10px">${view=='arc'?'取消收藏的题会自动进入这里，复考时可以再练。点“重新收藏”可以放回收藏。':'同类题放在一起练，也可以全部顺序或乱序练。取消收藏后，题目自动进入收藏库。'}</p>${L.length?`<div class="row"><button class="b pri" id="fa">全部按顺序练</button><button class="b" id="fm">全部乱序练</button></div>`:`<p class="sub">${view=='arc'?'还没有题目。在收藏里取消星标后，题目会出现在这里。':'还没有收藏。'}</p>`}<div id="run"></div><div class="grp" style="margin-top:14px">${rows.map(r=>`<button class="fam" data-f="${r[0]}"><span>${M.F[r[0]][0]}</span><span>${view=='arc'?'':'<span class="star">★</span> '}${r[1]}</span></button>`).join('')}</div>`;
 const end=()=>favs(view);if(L.length){$('#fa').onclick=()=>drill($('#run'),L,0,end);$('#fm').onclick=()=>drill($('#run'),mix(L),0,end)}
 $('#app').onclick=e=>{const t=e.target.closest('[data-t]');if(t){stop();favs(t.dataset.t);return}const b=e.target.closest('.fam');if(b)fam(b.dataset.f,{mode:view})}}
function drill(box,L,k,end,mock){if(k>=L.length)return end();const i=L[k],q=Q[i];let shown=false,left=30;
 box.innerHTML=`<div class="card"><div class="meta"><span>第 ${k+1} / ${L.length} 题</span><span>第 ${q[0]} 套 第 ${q[1]} 轮</span></div><div class="row" style="margin-top:6px"><button class="b" id="st" aria-pressed="${isFav(i)}">${starL(i)}</button><span class="tip" id="stn">${isArc(i)?'在收藏库':''}</span>${box._fam===q[2]?`<span class="tip">同类：${esc(M.F[q[2]][0])}</span>`:`<button class="b" id="sm">练同类：${esc(M.F[q[2]][0])}</button>`}</div><div class="pg"><div style="width:${k/L.length*100}%"></div></div>
 <div class="row"><button class="b" id="pv"${k?'':' disabled'}>上一题</button><button class="b" id="nq">下一题</button></div><div class="row"><button class="b pri" id="pl">播放语音</button><button class="b" id="tx">看题干</button><span class="tm" id="tm">30</span><span class="tip">说完点“看答案”</span><button class="b" id="an">看答案</button></div><p class="warn" id="er" hidden>语音没有播放成功。请检查网络，或在“考试要求”页下载语音，也可以先看题干练习。</p><div id="ptx" hidden><p class="p">${esc(q[3])}</p><p class="z">${esc(q[4])}</p></div><div id="res"></div></div>`;
 const start=()=>{clearInterval(tick);left=30;$('#tm').textContent=30;tick=setInterval(()=>{left--;const t=$('#tm');if(!t)return clearInterval(tick);t.textContent=left;t.classList.toggle('low',left<=10);if(left<=0){clearInterval(tick);if(!shown)reveal()}},1000)};
 const pl=()=>{$('#er').hidden=true;play(i,start,()=>{const e=$('#er');if(e)e.hidden=false})};
 const reveal=()=>{shown=true;stop();$('#ptx').hidden=false;$('#res').innerHTML=`<p class="a">${hl(q[5])}</p>${q[6]?`<p class="z">${esc(q[6])}</p>`:''}${q[7]?`<p class="n">App 注：${esc(q[7])}</p>`:''}${q[10]?`<p class="fx">App 原答案：${esc(q[10])}<br>修改原因：${esc(q[11])}</p>`:''}<div class="row"><button class="b ok" id="y">答对了</button><button class="b no" id="f">没答对</button><button class="b" id="re">再听一遍</button></div>`;
  $('#re').onclick=()=>play(i,()=>{},()=>{const e=$('#er');if(e)e.hidden=false});
  $('#y').onclick=()=>{mark(i,1);drill(box,L,k+1,end,mock)};$('#f').onclick=()=>{mark(i,0);drill(box,L,k+1,end,mock)}};
 $('#pv').onclick=()=>{stop();drill(box,L,k-1,end,mock)};$('#nq').onclick=()=>{stop();drill(box,L,k+1,end,mock)};box._cur=i;if(box._show)box._show();$('#st').onclick=e=>{const on=togFav(i);e.currentTarget.innerHTML=starL(i);$('#stn').textContent=on?'':'已移入收藏库';e.currentTarget.setAttribute('aria-pressed',on);if(box._fav)box._fav();summary()};{const sm=$('#sm');if(sm)sm.onclick=()=>{stop();fam(q[2],{mode:'all',start:i})}};$('#pl').onclick=pl;$('#tx').onclick=()=>{$('#ptx').hidden=!$('#ptx').hidden};$('#an').onclick=reveal;pl()}
function wrong(){nav('wrong');summary();$('#app').onclick=null;const L=Object.keys(W).map(Number);if(!L.length){$('#app').innerHTML='<p class="sub">还没有错题。练习时点“没答对”的题会出现在这里，答对后自动移出。</p>';return}
 $('#app').innerHTML='<div id="run"></div>';drill($('#run'),L,0,()=>wrong())}
function set(){nav('set');$('#app').onclick=null;const tags=[...new Set(M.S.flatMap(s=>String(s[2]).split(/[，,]/).map(t=>t.trim()).filter(Boolean)))];
 $('#app').innerHTML=`<p class="sub">选一套，再点任意一轮开始，也可以随机抽题。每轮 30 秒，和考试节奏一样。</p><div class="row"><select id="tg" aria-label="按考点筛选"><option value="">全部考点</option>${tags.map(t=>`<option>${esc(t)}</option>`).join('')}</select><select id="ss" aria-label="选择套题"></select><button class="b" id="rs">随机一套</button></div><div class="row"><button class="b pri" id="go">从第 1 轮开始</button><button class="b" id="sf">本套乱序</button><button class="b" id="rq">全题库随机 20 轮</button></div><div class="row grid" id="grid"></div><div id="run"></div>`;
 $('#run')._fav=()=>grid();$('#run')._show=()=>grid();
 const fill=()=>{const t=$('#tg').value,L=M.S.filter(s=>!t||String(s[2]).includes(t));$('#ss').innerHTML=L.map(s=>`<option value="${s[0]}">${esc(s[1])}</option>`).join('');return L};
 const ids=()=>{const n=+$('#ss').value;return Q.map((q,i)=>q[0]==n?i:-1).filter(i=>i>=0)};
 const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const fin=()=>{$('#run').innerHTML='<div class="card"><b>这一组练完了。</b></div>';grid()};
 const run=(L,k)=>{drill($('#run'),L,k,fin);$('#run').scrollIntoView({block:'nearest'})};
 const grid=()=>{const L=ids(),r=$('#run');$('#grid').innerHTML=L.map((i,k)=>gbtn(i,k,r._cur===i)).join('')};
 fill();const v=load('rtp.s',1);$('#ss').value=v;if(!$('#ss').value)$('#ss').selectedIndex=0;grid();
 $('#tg').onchange=()=>{stop();fill();$('#run').innerHTML='';grid()};$('#ss').onchange=()=>{stop();save('rtp.s',+$('#ss').value);$('#run').innerHTML='';grid()};
 $('#rs').onclick=()=>{const o=$('#ss').options;$('#ss').selectedIndex=Math.floor(Math.random()*o.length);save('rtp.s',+$('#ss').value);grid();run(ids(),0)};

function rule(){nav('rule');$('#app').onclick=null;const fx=Q.filter(q=>q[10]).length;$('#app').innerHTML=`<h2>按考试要求这样练</h2><div class="list"><div class="li">题型：15 至 20 个对话，飞行员角色，电脑播放管制指令和画外音。每个对话 30 秒，约 15 分钟。</div><div class="li">过线：10 个得分点答对 7 个以上，结构和理解才能到 4 级以上。</div><div class="li">评分：评分员依据标准答案，从发音、结构、词汇、流利和理解五方面评定。</div><div class="li">用语：优先用 ICAO 标准术语，标准术语覆盖不了时用简明英语。</div></div><h2 style="margin-top:18px">答案怎么处理</h2><div class="list"><div class="li">主答案是按 ICAO 标准用语和 5 级要求修订的版本，共修订 ${fx} 轮，其余意思和用语都合适的沿用 App 答案。</div><div class="li">有修订的题，答案下方显示 App 原答案和修改原因，方便对照。</div><div class="li">我没有拿到考试的逐题采分表。考试当天说法和 App 原答案不完全相同时，只要指令、数字和意图都准确，通常更符合大纲要求；具体判分以考官和教员为准。</div><div class="li">高亮是程序按规则标出的要点，只作提示。</div></div><h2 style="margin-top:18px">离线语音</h2><p class="sub">下载后没网也能听，手机上约需几十 MB，请在 Wi-Fi 下进行。</p><button class="b pri" id="dl">下载全部语音到本机</button><p class="tip" id="dls"></p>`;
 const st=$('#dls');(async()=>{try{const c=await caches.open(ACACHE),k=await c.keys(),h=new Set(k.map(r=>r.url)),n=Q.filter(q=>h.has(url(q))).length;st.textContent=`已下载 ${n} / ${Q.length} 条。更新程序不会删除语音，再点下载只补缺的。`}catch(e){st.textContent='这个浏览器不支持离线保存，语音只能联网播放。'}})();
 $('#dl').onclick=async e=>{e.target.disabled=true;let ok=0,fail=0;try{const c=await caches.open(ACACHE),todo=[];for(const q of Q){const u=url(q);if(await c.match(u))ok++;else todo.push(u)}
  const one=async u=>{for(let t=0;t<3;t++){try{let r=null;try{r=await fetch(u,{mode:'cors'});if(!r.ok)r=null}catch(x){r=null}if(r){await c.put(u,new Response(await r.blob(),{headers:{'Content-Type':'audio/mpeg'}}))}else{r=await fetch(u,{mode:'no-cors'});if(r.type!=='opaque'&&!r.ok)throw 0;await c.put(u,r)}return true}catch(x){}}return false};
  await Promise.all(Array.from({length:6},async()=>{while(todo.length){const u=todo.shift();if(await one(u))ok++;else fail++;if(document.contains(st))st.textContent=`正在下载… ${ok+fail} / ${Q.length}`}}));
  if(document.contains(st))st.textContent=fail?`已下载 ${ok} 条，${fail} 条失败。可以再点一次，只补缺的；如果一直失败，这些语音只能联网播放。`:`全部 ${ok} 条语音已下载，没网也能听。`;audTop()}catch(x){st.textContent='这个浏览器不支持离线保存，语音只能联网播放。'}e.target.disabled=false}}
function five(){nav('five');$('#app').onclick=null;const R=[['发音','口音有影响，但很少影响听懂','数字、呼号、跑道号逐个读清楚。录音回听，别人听一遍能听懂。'],['结构','基本句型一直用得对；复杂句尝试时可以有错','固定句型不出错。特情里说长句前，先拆成几个短句。'],['词汇','工作话题词汇够用且准确，有时能用习惯说法','故障和处置要说得出具体词，比如 stopping、rejected takeoff、depressurization。'],['流利','熟悉话题能较长时间轻松表达','30 秒内不卡顿说完。特情和情况报告也不要只靠背。'],['理解','工作话题理解准确；遇到语言或情境复杂时大多仍能准确','一遍听懂数字和指令。听到意外内容要能抓住重点，不确定时用 say again 或 confirm。'],['交流','回应及时、得体、有信息量，能有效把握对话','听完马上回答。不该重新呼叫时不呼叫，该报的情况主动报。']];
$('#app').innerHTML=`<h2>5 级要看什么</h2><p class="sub">ICAO 从六项分别评级，最终等级按最低一项确定，所以任何一项都不能掉到 4 级。</p><div class="list">${R.map(r=>`<div class="li"><b>${r[0]}</b><br>官方描述：${r[1]}。<br><span class="tip">练习重点（我的建议）：${r[2]}</span></div>`).join('')}</div><h2 style="margin-top:18px">和这个部分的关系</h2><div class="list"><div class="li">第三部分 10 个得分点答对 7 个以上，结构和理解才能到 4 级以上，这是底线。</div><div class="li">大纲对专家级考生的听力部分规定最高判定 5 级，工作级最高判定 4 级。</div></div><p class="tip" style="margin-top:12px">官方描述译自 ICAO 语言能力评级表。大纲没有逐题规定 5 级标准，练习重点是我的建议。</p>`}

function starL(i){return isFav(i)?'<span class="star">★</span> 已收藏':isArc(i)?'☆ 重新收藏':'☆ 收藏'}
