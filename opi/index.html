<div id="gate" style="max-width:420px;margin:0 auto;padding:70px 16px"><h1 style="font-size:24px;margin:0">OPI 口试</h1><p>请输入验证码。</p><form id="gf"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="验证码" placeholder="XXXX-XXXX-XXXX" style="width:100%;box-sizing:border-box;font:16px ui-monospace,Menlo,monospace;padding:10px"><p><button id="gb" style="padding:7px 18px">进入</button></p><p id="ge" hidden style="color:#c0392b"></p></form></div>

<main class="wrap" id="app" aria-live="polite"></main><p style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center"><a href="../" style="font-size:13px;color:var(--var)">← 900 句</a><button id="upd" style="font-size:13px">检查更新</button></p><p id="updMsg" class="small muted" style="text-align:center;margin:0 0 24px"></p></div>

<!-- Reusable question pack: to add a topic, add one object to topics. The app code never needs to change. -->


<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const norm=s=>s.toUpperCase().replace(/[^0-9A-Z]/g,'');
async function gfj(f){try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);const r=await fetch(f+'?nosw=1&t='+Date.now(),{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok)return await r.json()}catch(e){}return fetch(f).then(r=>r.json())}
async function unlock(code){const K=await gfj('keys.json');const pw=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(K.salt),iterations:K.iter,hash:'SHA-256'},pw,{name:'AES-GCM',length:256},false,['decrypt']);
 let raw=null,df='data.enc';for(const e of K.keys){try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},kek,b64(e.ct));df=e.d||'data.enc';break}catch(x){}}if(!raw)return null;
 const ck=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),D=await gfj(df);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},ck,b64(D.ct))))}

function app(PACK){
'use strict';
const RM=()=>!!(typeof S!=='undefined'&&S.set&&S.set.recall);const QL=()=>RM()?QS.filter(q=>hfN(q)>0):QS;const TQ=t=>RM()?t.qs.filter(q=>hfN(q)>0):t.qs;const QS=[];PACK.topics.forEach(t=>t.qs.forEach(q=>{q.topic=t;QS.push(q)}));
const byId=id=>QS.find(q=>q.id===id);
const CRIT=[
 ['发音','Pronunciation','很少影响听懂。受母语影响没关系，重音和节奏要稳。'],
 ['结构','Structure','基本句型始终控制得好。可以尝试复杂句，错误只是偶尔影响意思。'],
 ['词汇','Vocabulary','常见和工作话题词汇够用，能持续成功地换说法，偶尔地道。'],
 ['流利','Fluency','熟悉话题能长时间较轻松地说，会用连接词。'],
 ['理解','Comprehension','常见和工作话题听懂准确，遇到意外情况也大多准确。'],
 ['交互','Interactions','回应立即、恰当、有信息量，能有效管理对话。']
];
const LIFE=[["Could you say that again, please?","没听清"],["Do you mean…?","确认对方意思"],["Let me put it another way.","卡词时换说法"],["What I mean is…","解释自己的意思"],["From my point of view,…","开始表达观点"],["On the other hand,…","转折"],["For example,…","举例"],["So, to sum up,…","收尾"],["Let me think for a moment.","陌生题先争取时间"],["I'm not very familiar with that, but from my experience as a 737 captain,…","不熟也继续说"],["I would follow the manual and company procedure.","不确定时不编造"]];
const GAP=[1,3,7,14,30,60];
const KEY='icao-opi.v1';
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dstr=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const add=(n)=>{const d=today();d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slots=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="slot">[$1]</span>');
const $=s=>document.querySelector(s);
let S={cards:{},set:{newPerDay:8,exam:'2026-11-13'},mocks:[],day:{},t:0};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.cards){S=Object.assign(S,x);if(!S.set.exam)S.set.exam='2026-11-13'}}catch(e){}
let dbDoc=null,sample=null,syncTxt='本机保存',wTimer=null;
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(dbDoc){clearTimeout(wTimer);wTimer=setTimeout(async()=>{try{await dbDoc.set(JSON.parse(JSON.stringify(S)));syncTxt='已同步到账号'}catch(e){syncTxt='同步失败，已存本机'}const el=$('#sync');if(el)el.textContent=syncTxt},1200)}}
function card(id){return S.cards[id]||(S.cards[id]={b:-1,due:'',lapse:0,weak:[],my:''})}
function isNew(id){return card(id).b<0}
function isDue(id){const c=card(id);return c.b>=0&&c.due<=dstr(today())}
function newToday(){const d=dstr(today());return (S.day[d]||0)}
function queue(){const due=QL().filter(q=>isDue(q.id)).sort((a,b)=>card(a.id).due<card(b.id).due?-1:1);const room=Math.max(0,(+S.set.newPerDay||3)-newToday());return due.concat(QL().filter(q=>isNew(q.id)).sort((a,b)=>hfN(b)-hfN(a)).slice(0,room))}
function rate(id,r){
 const c=card(id),wasNew=c.b<0;let gap;
 if(r===0){c.b=Math.max(0,c.b-1);c.lapse++;gap=0}
 else if(r===1){c.b=Math.max(0,c.b);gap=Math.max(1,Math.round(GAP[c.b]/2))}
 else if(r===2){c.b=Math.min(GAP.length-1,c.b+1);gap=GAP[c.b]}
 else{c.b=Math.min(GAP.length-1,c.b+2);gap=GAP[c.b]}
 if(S.set.exam){const left=Math.round((new Date(S.set.exam+'T00:00:00')-today())/864e5)-1;if(left>0&&gap>left)gap=left}
 c.due=add(gap);
 if(wasNew){const d=dstr(today());S.day[d]=(S.day[d]||0)+1}
 save();
}
function frameHTML(eng,fill,mode){return frameRaw(eng,fill,mode).replace(/In practice, we (<[^>]+>)(one pilot|they |the 737|low CI|it&#39;s|it's|SNOWTAM)/,'In practice, $1$2')}
function frameRaw(eng,fill,mode){let i=0;return esc(PACK.engines[eng].frame).replace(/\[([^\]]+)\]/g,(m,k)=>{const v=fill?fill[i++]:null;if(mode==='blank'||!fill)return '<span class="blank">'+esc(k)+'</span>';return '<b class="fill">'+esc(v)+'</b>'})}
const STRUCT='<div class="s131"><div><b>1</b><span>一句话直接回答</span></div><div><b>3</b><span>三个要点</span></div><div><b>1</b><span>一句收尾</span></div></div>';
const hfN=q=>{if(q._h!=null)return q._h;if(!q.hf||!PACK.sessions)return q._h=0;const re=new RegExp(q.hf,'i');return q._h=PACK.sessions.filter(x=>x.q.some(t=>re.test(t))).length};
const hfTag=q=>{const n=hfN(q);return n>=8?'<span class="hot h3">★★★ 高频 '+n+' 场</span>':n>=4?'<span class="hot h2">★★ 高频 '+n+' 场</span>':n>=1?'<span class="hot h1">★ 考过 '+n+' 场</span>':''};
const topicN=t=>{const a=t.qs.filter(q=>q.hf).map(q=>new RegExp(q.hf,'i'));return (PACK.sessions||[]).filter(x=>x.q.some(q=>a.some(r=>r.test(q)))).length};
/* speech */
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Fred|Good News|Jester|Junior|Kathy|Organ|Superstar|Trinoids|Whisper|Zarvox|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Deranged|Hysterical|Pipe Organ)\b/i;
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!NOVELTY.test(v.name))}catch(e){return []}}
