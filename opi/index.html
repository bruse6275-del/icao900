summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px}
textarea,input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:10px;width:100%;border-radius:2px}

.qrow small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}.dot.due{color:var(--accent)}.dot.good{color:var(--ok)}
.s131{display:grid;grid-template-columns:1fr 1.2fr 1fr;border:1px solid var(--rule)}.s131>div{padding:10px;border-left:1px solid var(--rule);display:grid;gap:2px;min-width:0}.s131>div:first-child{border-left:0}.s131 b{font-family:var(--mono);font-size:30px;line-height:1;color:var(--accent)}.s131 span{font-size:13px}
.frame{font-size:17px;line-height:1.75;overflow-wrap:anywhere}.blank{font-family:var(--mono);font-size:13px;color:var(--var);border:1px dashed var(--var);padding:1px 6px;white-space:nowrap}.fill{font-weight:600;color:var(--var)}
.mapr{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--rule)}.mapr .ct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opt{display:grid;gap:6px}.opt button{text-align:left}.opt button.right{border-color:var(--ok);color:var(--ok);font-weight:600}.opt button.wrong{border-color:var(--prob);color:var(--prob)}
.hot{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}.hot.h3{color:var(--prob)}.hot.h2{color:var(--link)}.hot.h1{color:var(--muted)}
.pimg{display:block;width:100%;max-height:50vh;object-fit:contain;background:var(--paper);border:1px solid var(--rule)}

<div id="gate" style="max-width:420px;margin:0 auto;padding:70px 16px"><h1 style="font-size:24px;margin:0">OPI 口试</h1><p>请输入验证码。</p><form id="gf"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="验证码" placeholder="XXXX-XXXX-XXXX" style="width:100%;box-sizing:border-box;font:16px ui-monospace,Menlo,monospace;padding:10px"><p><button id="gb" style="padding:7px 18px">进入</button></p><p id="ge" hidden style="color:#c0392b"></p></form></div>
<div id="shell" hidden><nav><div class="in" id="nav"></div></nav>
<main class="wrap" id="app" aria-live="polite"></main><p style="text-align:center"><button id="out" style="font-size:13px">退出</button></p></div>

<!-- Reusable question pack: to add a topic, add one object to topics. The app code never needs to change. -->
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const norm=s=>s.toUpperCase().replace(/[^0-9A-Z]/g,'');
async function unlock(code){const K=await fetch('keys.json',{cache:'no-cache'}).then(r=>r.json());const pw=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(K.salt),iterations:K.iter,hash:'SHA-256'},pw,{name:'AES-GCM',length:256},false,['decrypt']);
 let raw=null;for(const e of K.keys){try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},kek,b64(e.ct));break}catch(x){}}if(!raw)return null;
 const ck=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),D=await fetch('data.enc',{cache:'no-cache'}).then(r=>r.json());
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},ck,b64(D.ct))))}

function app(PACK){
'use strict';
const QS=[];PACK.topics.forEach(t=>t.qs.forEach(q=>{q.topic=t;QS.push(q)}));
const byId=id=>QS.find(q=>q.id===id);
const CRIT=[
 ['发音','Pronunciation','很少影响听懂。受母语影响没关系，重音和节奏要稳。'],
 ['结构','Structure','基本句型始终控制得好。可以尝试复杂句，错误只是偶尔影响意思。'],
 ['词汇','Vocabulary','常见和工作话题词汇够用，能持续成功地换说法，偶尔地道。'],
 ['流利','Fluency','熟悉话题能长时间较轻松地说，会用连接词。'],
 ['理解','Comprehension','常见和工作话题听懂准确，遇到意外情况也大多准确。'],
 ['交互','Interactions','回应立即、恰当、有信息量，能有效管理对话。']
];
const LIFE=[["Could you say that again, please?","没听清"],["Do you mean…?","确认对方意思"],["Let me put it another way.","卡词时换说法"],["What I mean is…","解释自己的意思"],["From my point of view,…","开始表达观点"],["On the other hand,…","转折"],["For example,…","举例"],["So, to sum up,…","收尾"],["Let me think for a moment.","陌生题先争取时间"],["I'm not very familiar with that, but from my experience as a 737 captain,…","不熟也继续说"],["I would follow the manual and company procedure.","不确定时不编造"]];
const GAP=[1,3,7,14,30,60];
const KEY='opip.v1';
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dstr=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const add=(n)=>{const d=today();d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slots=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="slot">[$1]</span>');
const $=s=>document.querySelector(s);
let S={cards:{},set:{newPerDay:8,exam:'2026-11-13'},mocks:[],day:{},t:0};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.cards){S=Object.assign(S,x);}}catch(e){}
let dbDoc=null,sample=null,syncTxt='本机保存',wTimer=null;
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(dbDoc){clearTimeout(wTimer);wTimer=setTimeout(async()=>{try{await dbDoc.set(JSON.parse(JSON.stringify(S)));syncTxt='已同步到账号'}catch(e){syncTxt='同步失败，已存本机'}const el=$('#sync');if(el)el.textContent=syncTxt},1200)}}
function card(id){return S.cards[id]||(S.cards[id]={b:-1,due:'',lapse:0,weak:[],my:''})}
function isNew(id){return card(id).b<0}
function isDue(id){const c=card(id);return c.b>=0&&c.due<=dstr(today())}
function newToday(){const d=dstr(today());return (S.day[d]||0)}
function queue(){const due=QS.filter(q=>isDue(q.id)).sort((a,b)=>card(a.id).due<card(b.id).due?-1:1);const room=Math.max(0,(+S.set.newPerDay||3)-newToday());return due.concat(QS.filter(q=>isNew(q.id)).sort((a,b)=>hfN(b)-hfN(a)).slice(0,room))}
function rate(id,r){
 const c=card(id),wasNew=c.b<0;let gap;
 if(r===0){c.b=Math.max(0,c.b-1);c.lapse++;gap=0}
 else if(r===1){c.b=Math.max(0,c.b);gap=Math.max(1,Math.round(GAP[c.b]/2))}
 else if(r===2){c.b=Math.min(GAP.length-1,c.b+1);gap=GAP[c.b]}
 else{c.b=Math.min(GAP.length-1,c.b+2);gap=GAP[c.b]}
 if(S.set.exam){const left=Math.round((new Date(S.set.exam+'T00:00:00')-today())/864e5)-1;if(left>0&&gap>left)gap=left}
 c.due=add(gap);
 if(wasNew){const d=dstr(today());S.day[d]=(S.day[d]||0)+1}
 save();
}
function frameHTML(eng,fill,mode){return frameRaw(eng,fill,mode).replace(/In practice, we (<[^>]+>)(one pilot|they |the 737|low CI|it&#39;s|it's|SNOWTAM)/,'In practice, $1$2')}
function frameRaw(eng,fill,mode){let i=0;return esc(PACK.engines[eng].frame).replace(/\[([^\]]+)\]/g,(m,k)=>{const v=fill?fill[i++]:null;if(mode==='blank'||!fill)return '<span class="blank">'+esc(k)+'</span>';return '<b class="fill">'+esc(v)+'</b>'})}
const STRUCT='<div class="s131"><div><b>1</b><span>一句话直接回答</span></div><div><b>3</b><span>三个要点</span></div><div><b>1</b><span>一句收尾</span></div></div>';
const hfN=q=>{if(q._h!=null)return q._h;if(!q.hf||!PACK.sessions)return q._h=0;const re=new RegExp(q.hf,'i');return q._h=PACK.sessions.filter(x=>x.q.some(t=>re.test(t))).length};
const hfTag=q=>{const n=hfN(q);return n>=8?'<span class="hot h3">★★★ 高频 '+n+' 场</span>':n>=4?'<span class="hot h2">★★ 高频 '+n+' 场</span>':n>=1?'<span class="hot h1">★ 考过 '+n+' 场</span>':''};
const topicN=t=>{const a=t.qs.filter(q=>q.hf).map(q=>new RegExp(q.hf,'i'));return (PACK.sessions||[]).filter(x=>x.q.some(q=>a.some(r=>r.test(q)))).length};
/* speech */
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}catch(e){return []}}
function bestVoice(vs){if(!vs.length)return null;const us=vs.filter(v=>/en[-_]US/i.test(v.lang)),L=us.length?us:vs;return L.find(v=>/natural|neural|premium|enhanced|google|samantha/i.test(v.name))||L[0]}
function speak(text,onfail){try{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){onfail&&onfail();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vs=enVoices(),st=(typeof S!=='undefined'&&S.set)||{},vn=st.voice?vs.find(x=>x.name===st.voice):bestVoice(vs);if(vn){u.voice=vn;u.lang=vn.lang}else u.lang='en-US';u.rate=st.rate||.92;u.onerror=()=>{onfail&&onfail()};speechSynthesis.speak(u)}catch(e){onfail&&onfail()}}
/* timer */
let tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function timerHTML(sec){return '<div class="timer" id="tm"><div class="tnum" id="tn">'+sec+'</div><div class="tbar"><i id="tb"></i></div></div>'}
function startTimer(sec){stopTimer();let left=sec;const el=$('#tm');if(!el)return;const paint=()=>{const n=$('#tn'),b=$('#tb');if(!n)return stopTimer();n.textContent=left>=0?left:'+'+(-left);b.style.width=Math.max(0,left/sec*100)+'%';el.classList.toggle('over',left<0)};paint();tick=setInterval(()=>{left--;paint()},1000)}
/* nav */
let view='module';
const TABS=[['module','模块速通'],['today','今日训练'],['mock','模拟口试'],['hot','高频题'],['pic','看图题'],['chain','追问训练'],['cold','陌生题'],['real','真题频率'],['bank','题库'],['cov','覆盖表'],['tts','朗读设置'],['std','5 级标准']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>'<button data-nav="'+k+'"'+(view===k?' aria-current="page"':'')+'>'+l+'</button>').join('')}
function go(v){stopTimer();try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}view=v;nav();R[v]();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n)go(n.dataset.nav)});
const R={};
/* module */
let curT=0;try{curT=Math.min(PACK.topics.length-1,+localStorage.getItem('opip.topic')||0)}catch(e){}
function modState(id){S.mod=S.mod||{};return S.mod[id]||(S.mod[id]={a:false,b:0,c:0})}
R.module=function(){
 const t=PACK.topics[curT],m=modState(t.id),E=PACK.engines;
 const groups=Object.keys(E).map(k=>[k,t.qs.filter(q=>q.engine===k)]).filter(g=>g[1].length);
 $('#app').innerHTML='<div class="chips" role="group" aria-label="选择模块">'+PACK.topics.map((x,i)=>[x,i,topicN(x)]).sort((a,b)=>b[2]-a[2]).map(([x,i,n])=>'<button data-t="'+i+'" aria-pressed="'+(i===curT)+'">'+(n>=12?'★★★ ':n>=7?'★★ ':'')+esc(x.title)+' · '+n+'场</button>').join('')+'</div><header style="display:grid;gap:6px"><div class="eyebrow">'+esc(t.section)+' · '+esc(t.title)+'</div><h1 style="font-size:32px">'+t.qs.length+' 道题，还是这 1 个结构</h1><p class="muted">所有答案都是 1-3-1。题型和句式每个模块都一样，只需要记蓝色的词。</p></header>'+STRUCT+

const CK='opip.code',ge=document.getElementById('ge');
async function enter(code,auto){const btn=document.getElementById('gb');btn.disabled=true;ge.hidden=true;try{const d=await unlock(code);if(!d){if(auto){try{localStorage.removeItem(CK)}catch(e){}}else{ge.textContent='验证码不正确，请核对后再试。';ge.hidden=false}btn.disabled=false;return}
  try{localStorage.setItem(CK,code)}catch(e){}document.getElementById('gate').hidden=true;document.getElementById('shell').hidden=false;app(d)}catch(e){ge.textContent='暂时打不开，请检查网络后再试。';ge.hidden=false;btn.disabled=false}}
document.getElementById('gf').onsubmit=e=>{e.preventDefault();enter(document.getElementById('code').value.trim())};
document.getElementById('out').onclick=()=>{try{localStorage.removeItem(CK)}catch(e){}location.reload()};
try{const c=localStorage.getItem(CK);if(c)enter(c,true)}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
